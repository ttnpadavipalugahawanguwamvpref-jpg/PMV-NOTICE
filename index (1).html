/* ===== PMV HOME PAGE / READABILITY ENHANCEMENT ===== */
body{font-size:15px;line-height:1.6}
body.bg-active .main{background:rgba(246,244,242,.82)}
.layout{background:rgba(246,244,242,.88)}
.page{padding:32px;max-width:1240px}
.page-title{font-weight:900;letter-spacing:-.02em}
.intro{font-size:15px;color:#4f454a;font-weight:600}
.section-head{margin:32px 0 14px}
.section-head h2{font-size:24px;font-weight:900}
.card,.panel,.stat,.list-row{background:rgba(255,255,255,.985)}
.card h3,.list-row h3{font-size:19px;font-weight:900;line-height:1.35}
.card p,.list-row p{font-size:14px;color:#4b4247;line-height:1.7}
.date{font-size:12px;color:#5d5257;font-weight:700}
.hero{min-height:430px;padding:42px;align-items:flex-end;background:linear-gradient(90deg,rgba(55,7,22,.93),rgba(76,14,34,.76),rgba(76,14,34,.30)),url('image/school.png') center/cover}
.hero-content{max-width:860px;background:rgba(25,8,15,.20);padding:8px 0}
.hero-school{font-size:15px;color:#ffe8a2;text-shadow:0 2px 5px rgba(0,0,0,.55)}
.hero-title{font-size:clamp(34px,4.7vw,60px);font-weight:900;text-shadow:0 4px 16px rgba(0,0,0,.68);line-height:1.1}
.hero-text{font-size:17px;font-weight:700;color:#fff;line-height:1.8;text-shadow:0 3px 10px rgba(0,0,0,.72);max-width:800px}
.hero .btn{font-size:14px;padding:13px 18px}
.stats{gap:18px;margin-top:22px}
.stat{padding:22px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;right:-22px;bottom:-28px;width:90px;height:90px;border-radius:50%;background:rgba(215,169,40,.12)}
.stat b{font-size:34px;font-weight:900}
.stat small{font-size:13px;font-weight:800;color:#5d5358}
.home-grid-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(310px,.75fr);gap:20px;align-items:start}
.home-feature{background:rgba(255,255,255,.985);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 22px rgba(53,16,27,.07)}
.home-feature h3{margin:0 0 8px;color:var(--wine2);font-size:21px}
.home-feature p{margin:0;color:#4b4247;line-height:1.75}
.home-quick{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.quick-tile{background:linear-gradient(180deg,#fff,#fffaf0);border:1px solid var(--line);border-radius:17px;padding:16px 12px;text-align:center;cursor:pointer;transition:.18s;box-shadow:0 5px 18px rgba(53,16,27,.05)}
.quick-tile:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(53,16,27,.10)}
.quick-tile .qicon{font-size:28px;display:block;margin-bottom:7px}
.quick-tile b{font-size:13px;line-height:1.35;color:var(--wine2)}
.home-section{margin-top:30px}
.home-feature .section-head{margin:0 0 12px}
.home-notices .card,.home-events .card{height:100%}
.home-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.home-media-grid .media{height:100%}
.home-about{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
.home-about .home-feature{height:100%}
.home-contact{display:flex;justify-content:space-between;align-items:center;gap:20px}
.home-contact .contact-actions{display:flex;gap:9px;flex-wrap:wrap}
.school-leader-card{display:grid;grid-template-columns:135px 1fr;gap:22px;align-items:center}
.school-leader-card .avatar{width:135px;height:135px}
.staff-grid.home-staff{grid-template-columns:repeat(4,1fr)}
.badge-label{display:inline-flex;align-items:center;gap:6px;background:#f7edf0;color:var(--wine);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}
@media(max-width:1050px){.home-quick{grid-template-columns:repeat(3,1fr)}.home-grid-2{grid-template-columns:1fr}.home-about{grid-template-columns:1fr 1fr}.staff-grid.home-staff{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.page{padding:22px 15px 82px}.hero{min-height:420px;padding:26px 22px}.hero-title{font-size:35px}.hero-text{font-size:15px}.home-about{grid-template-columns:1fr}.home-media-grid{grid-template-columns:1fr 1fr}.staff-grid.home-staff{grid-template-columns:1fr 1fr}.school-leader-card{grid-template-columns:1fr;text-align:center}.school-leader-card .avatar{margin:auto}.home-contact{flex-direction:column;align-items:flex-start}}
@media(max-width:520px){.home-quick{grid-template-columns:repeat(2,1fr)}.home-media-grid,.staff-grid.home-staff{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:28px}}



/* ===== PMV DARK THEME ===== */
body.dark-theme{--bg:#111014;--card:#1b191e;--text:#f3eef0;--muted:#bbb0b6;--line:#393239;--shadow:0 10px 30px rgba(0,0,0,.28);background-color:var(--bg);color:var(--text)}
.dark-theme .layout{background:rgba(17,16,20,.94)}
.dark-theme .side{background:rgba(27,25,30,.98);border-color:var(--line)}
.dark-theme .nav a{color:#ddd2d8}.dark-theme .nav a:hover,.dark-theme .nav a.active{background:#3c2c16;color:#ffe6a0}
.dark-theme .stat,.dark-theme .card,.dark-theme .panel,.dark-theme .list-row,.dark-theme .home-feature,.dark-theme .media,.dark-theme .quick-tile{background:#1b191e;border-color:var(--line);box-shadow:0 8px 25px rgba(0,0,0,.20)}
.dark-theme .card h3,.dark-theme .list-row h3,.dark-theme .home-feature h3,.dark-theme .section-head h2,.dark-theme .page-title{color:#ffe9a6}
.dark-theme .card p,.dark-theme .list-row p,.dark-theme .home-feature p,.dark-theme .intro{color:#d0c5ca}
.dark-theme .stat small,.dark-theme .date,.dark-theme .muted,.dark-theme .file-name{color:#bdb2b8}
.dark-theme .field{background:#242126;color:#f4eef1;border-color:#4a4147}.dark-theme .field::placeholder{color:#9f949a}
.dark-theme .admin-tab{background:#242126;color:#f4e7ea;border-color:#4a4147}.dark-theme .admin-tab.active{background:var(--wine);color:#fff}
.dark-theme .empty{background:#18161a;color:#bdb2b8;border-color:#514850}.dark-theme .btn-light{background:#242126;color:#ffe9a6;border-color:#4a4147}
.dark-theme .bottom{background:#18161a;border-color:var(--line)}.dark-theme .bottom a{color:#ffe9a6}
.dark-theme .modal-inner{background:#1b191e;color:var(--text)}.dark-theme .modal h2{color:#ffe9a6}.dark-theme .close{background:#2b282d;color:#fff}
.dark-theme .language-screen{background:linear-gradient(145deg,#240814,#68152f)}
.dark-theme .lang-box{background:#1b191e;color:#f4eef1}.dark-theme .lang-box h1{color:#ffe9a6}
.dark-theme .admin-note{background:#302a18;border-color:#6b5a24;color:#f4df91}
.dark-theme .badge-label{background:#31272b;color:#ffe9a6}
.dark-theme .notice-card:hover,.dark-theme .event-card:hover,.dark-theme .achievement-card:hover{box-shadow:0 18px 35px rgba(0,0,0,.35)}

.form-field{color:#111!important}.form-field span{color:#222!important}.card p,.list-row p,.home-feature p,.media-desc,.notice-preview{white-space:pre-line}.stat,.card,.panel,.list-row,.media,.home-feature{color:#111}.hero-text,.hero-title{color:#fff}.btn,.tag,.badge-label,.nav a,.top,.bottom a{font-weight:900}
.dark-theme .form-field,.dark-theme .form-field span{color:#f1ecef!important}.dark-theme .card,.dark-theme .panel,.dark-theme .list-row,.dark-theme .media,.dark-theme .stat{color:#f1ecef}.dark-theme .empty{color:#ddd!important}

    if(Array.isArray(cleanDb[k]))cleanDb[k]=cleanDb[k].map(x=>pmvStripMedia(x,pmvMediaFields[k]));
  }
  return {school:pmvStripMedia(school,pmvMediaFields.school),db:cleanDb,notifications:clone(notifications),updatedAt:Date.now()};
}
function pmvMergeMedia(localItem,remoteItem,fields){
  const merged={...remoteItem};
  for(const f of (fields||[])){if(localItem&&localItem[f]!==undefined&&(remoteItem[f]===undefined||remoteItem[f]===null||remoteItem[f]===''))merged[f]=localItem[f];}
  return merged;
}
function pmvMergeRemote(remote){
  if(remote.school){
    const localPrincipal=school&&school.principal?school.principal:{};
    school={...clone(remote.school)};
    school.principal=pmvMergeMedia(localPrincipal,school.principal||{},['photoData','photoId']);
  }
  if(remote.db){
    const old=clone(db),incoming=clone(remote.db);
    for(const k of ['teachers','gallery','videos','applications','events','achievements']){
      if(Array.isArray(incoming[k])){
        const oldMap=new Map((old[k]||[]).map(x=>[String(x.id),x]));
        incoming[k]=incoming[k].map(x=>pmvMergeMedia(oldMap.get(String(x.id)),x,pmvMediaFields[k]));
      }
    }
    db={...old,...incoming};
  }
  if(Array.isArray(remote.notifications))notifications=clone(remote.notifications);
}
function pmvCloudWrite(){
  if(!window.pmvFirestore||!pmvFirestoreReady||pmvFirestoreApplying)return;
  clearTimeout(pmvFirestoreTimer);
  pmvFirestoreTimer=setTimeout(async()=>{
    try{await window.pmvFirestore.doc(PMV_CLOUD_DOC).set(pmvCloudPayload());}
    catch(err){console.error('Firestore write failed:',err);toast(t('Cloud save failed. Check Firestore Rules.','Cloud save වුණේ නැහැ. Firestore Rules බලන්න.'));}
  },250);
}
async function pmvInitFirestore(){
  if(!window.pmvFirestore)return;
  try{
    const ref=window.pmvFirestore.doc(PMV_CLOUD_DOC);
    const snap=await ref.get();
    if(snap.exists){
      pmvFirestoreApplying=true;
      pmvMergeRemote(snap.data()||{});
      saveAllLocalOnly();
      pmvFirestoreApplying=false;
      render();
    }else{
      await ref.set(pmvCloudPayload());
    }
    pmvFirestoreReady=true;
    if(pmvFirestoreUnsub)pmvFirestoreUnsub();
    pmvFirestoreUnsub=ref.onSnapshot(s=>{
      if(!s.exists||pmvFirestoreApplying)return;
      pmvFirestoreApplying=true;
      try{pmvMergeRemote(s.data()||{});saveAllLocalOnly();render();}
      finally{pmvFirestoreApplying=false;}
    },err=>console.error('Firestore listener failed:',err));
    console.log('PMV Firestore connected.');
  }catch(err){
    console.error('Firestore connection failed:',err);
    pmvFirestoreReady=false;
  }
}

function notices(){return `<div class="page">${heading('Notices','දැනුම්දීම්','School news, reminders and messages.','පාසල් පුවත්, මතක් කිරීම් හා වැදගත් දැනුම්දීම්.')}<div class="toolbar"><input class="field search" id="noticeSearch" placeholder="${t('Search notices...','දැනුම්දීම් සොයන්න...')}" oninput="filterText(this,'noticeList')"></div><div id="noticeList" class="grid">${db.notices.map(noticeCard).join('')||empty(t('No notices yet.','දැනුම්දීම් නැත.'))}</div></div>`}
function events(){return `<div class="page">${heading('Events','සිදුවීම්','School gatherings, celebrations and important dates.','පාසල් උත්සව, වැඩසටහන් හා වැදගත් දින.')}<div class="grid">${db.events.map(eventCard).join('')||empty(t('No events yet.','සිදුවීම් නැත.'))}</div></div>`}
function parents(){return `<div class="page">${heading('For Parents','දෙමාපියන් සඳහා','Helpful information for families supporting their children.','දරුවන්ට සහය වන දෙමාපියන් සඳහා වැදගත් තොරතුරු.')}<div class="grid">${[['📅','Calendar','දින දර්ශනය','events'],['📢','Notices','දැනුම්දීම්','notices'],['📄','Forms & PDFs','අයදුම්පත් හා PDF','applications'],['✉️','Contact School','පාසල අමතන්න','contact']].map(x=>`<article class="card"><div class="icon">${x[0]}</div><h3>${t(x[1],x[2])}</h3><button class="btn btn-primary btn-small" onclick="go('${x[3]}')">${t('Open','විවෘත කරන්න')} →</button></article>`).join('')}</div><div class="section-head"><h2>${esc(t(school.parentsTitleEn||'Family Partnership',school.parentsTitleSi||'පවුල් සහභාගීත්වය'))}</h2></div><div class="panel" style="padding:20px"><p>${esc(t(school.parentsTextEn||'We value open communication between home and school. Please contact the school office for help or information.',school.parentsTextSi||'නිවස හා පාසල අතර හොඳ සම්බන්ධතාවයක් අපි අගය කරමු. වැඩි විස්තර සඳහා පාසල් කාර්යාලය අමතන්න.'))}</p><button class="btn btn-primary" onclick="go('contact')">${t('Contact the office','කාර්යාලය අමතන්න')}</button></div></div>`}
function applications(){return `<div class="page">${heading('Applications & PDFs','අයදුම්පත් සහ PDF','Open, preview, download or print approved school forms.','අනුමත පාසල් අයදුම්පත් විවෘත, පෙරදසුන්, download හෝ print කරන්න.')}<div class="list">${db.applications.length?db.applications.map(a=>`<div class="list-row"><div><h3>${esc(t(a.titleEn,a.titleSi))}</h3><p>${esc(t(a.descEn,a.descSi))}</p><div class="file-name">${esc(a.fileName||'PDF')}</div></div><div class="item-tools"><button class="btn btn-primary btn-small" onclick="openPdf(${a.id})">${t('Open','විවෘත කරන්න')}</button><button class="btn btn-gold btn-small" onclick="downloadPdf(${a.id})">${t('Download','Download')}</button><button class="btn btn-light btn-small" onclick="printPdf(${a.id})">${t('Print','Print')}</button></div></div>`).join(''):empty(t('No PDF forms added yet. Admin can add them.','PDF අයදුම්පත් තවම එකතු කර නැත. Admin මගින් එකතු කළ හැකිය.'))}</div></div>`}
function gallery(){return `<div class="page">${heading('School Gallery','පාසල් ගැලරිය','Photos added by the school admin.','පාසල් Admin විසින් එක් කළ ඡායාරූප.')}<div id="galleryGrid" class="media-grid">${db.gallery.length?db.gallery.map(x=>mediaCard(x,'photo')).join(''):empty(t('No photos yet.','ඡායාරූප නැත.'))}</div></div>`}
function videos(){return `<div class="page">${heading('School Videos','පාසල් වීඩියෝ','Videos added by the school admin.','පාසල් Admin විසින් එක් කළ වීඩියෝ.')}<div class="media-grid">${db.videos.length?db.videos.map(x=>mediaCard(x,'video')).join(''):empty(t('No videos yet.','වීඩියෝ නැත.'))}</div></div>`}
function mediaCard(x,kind){const src=x.dataUrl||x.photoData||'';const fullDesc=t(x.descEn,x.descSi)||'';const shortDesc=shorten(fullDesc,120);return `<div class="media media-clickable"><div id="media-${kind}-${x.id}" data-media-card="${kind}" data-id="${x.id}" onclick="openMediaItem('${kind}',${x.id})">${src?`<img class="media-cover" src="${esc(src)}" alt="${esc(t(x.titleEn,x.titleSi))}" loading="lazy">`:`<div class="empty">${kind==='photo'?t('Photo loading...','Photo load වෙමින්...'):t('Video loading...','Video load වෙමින්...')}</div>`}</div><div class="media-title">${esc(t(x.titleEn,x.titleSi))}</div>${fullDesc?`<p class="media-desc description-preview">${esc(shortDesc)}</p><button class="btn btn-gold btn-small read-more-btn" onclick="event.stopPropagation();openMediaItem('${kind}',${x.id})">${t('Read more','තව කියවන්න')} →</button>`:''}<div class="media-actions"><button class="btn btn-primary btn-small" onclick="event.stopPropagation();openMediaItem('${kind}',${x.id})">${kind==='photo'?t('Open Photo','ඡායාරූපය විවෘත කරන්න'):t('Open Video','වීඩියෝව විවෘත කරන්න')}</button></div></div>`}
function staff(){return `<div class="page">${heading('Our Staff','කාර්ය මණ්ඩලය','Meet our principal and teachers.','අපගේ විදුහල්පති හා ගුරු මණ්ඩලය හඳුනා ගන්න.')}<div class="section-head"><h2>${t('Principal','විදුහල්පති')}</h2></div><div class="panel principal" style="padding:20px">${school.principal.photoData?`<img class="avatar" src="${esc(school.principal.photoData)}" alt="Principal">`:school.principal.photoId?`<img class="avatar" src="" data-media-id="${school.principal.photoId}" alt="Principal">`:`<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:42px">👤</div>`}<div><div class="eyebrow">${t('School Leader','පාසල් නායකත්වය')}</div><h2 style="color:var(--wine);margin:5px 0">${esc(t(school.principal.nameEn,school.principal.nameSi))}</h2><p style="white-space:pre-line">${esc(t(school.principal.bioEn,school.principal.bioSi))}</p></div></div><div class="section-head"><h2>${t('Teachers','ගුරුවරු')}</h2><span class="date">${db.teachers.length} ${t('teachers','ගුරුවරු')}</span></div><div class="staff-grid">${db.teachers.length?db.teachers.map(teacherCard).join(''):empty(t('No teacher profiles yet.','ගුරු පැතිකඩ නැත.'))}</div></div>`}
function achievements(){return `<div class="page">${heading('Achievements','ජයග්‍රහණ','Celebrate achievements with a photo, video and description.','ඡායාරූප, වීඩියෝ හා විස්තර සමඟ පාසල් ජයග්‍රහණ.')}<div class="grid">${db.achievements.map(achievementCard).join('')||empty(t('No achievements yet.','ජයග්‍රහණ නැත.'))}</div></div>`}
function about(){return `<div class="page">${heading('About School','පාසල ගැන','School mission, vision and key information.','පාසලේ මෙහෙවර, දැක්ම හා වැදගත් තොරතුරු.')}<div class="grid"><article class="card"><div class="icon">🎯</div><h3>${t('Mission','මෙහෙවර')}</h3><p>${esc(t(school.missionEn,school.missionSi))}</p></article><article class="card"><div class="icon">🌟</div><h3>${t('Vision','දැක්ම')}</h3><p>${esc(t(school.visionEn,school.visionSi))}</p></article><article class="card"><div class="icon">🏫</div><h3>${t('School','පාසල')}</h3><p>${esc(currentName())}</p></article></div><div class="section-head"><h2>${t('Contact details','සම්බන්ධතා විස්තර')}</h2></div><div class="panel" style="padding:20px"><p>${esc(t(school.addressEn,school.addressSi))}<br>☎ ${esc(school.phone)}<br>✉ ${esc(school.email)}</p></div></div>`}
function contact(){return `<div class="page">${heading('Contact School','පාසල අමතන්න','Send a message from this device.','මෙම උපාංගයෙන් පණිවිඩයක් යවන්න.')}<form class="panel" style="padding:20px;display:grid;gap:12px" onsubmit="submitContact(event)"><input class="field" id="cname" required placeholder="${t('Name','නම')}"><input class="field" id="cphone" placeholder="${t('Phone','දුරකථන අංකය')}"><input class="field" id="cemail" type="email" required placeholder="${t('Email','Email')}"><textarea class="field" id="cmsg" rows="6" required placeholder="${t('Message','පණිවිඩය')}"></textarea><button class="btn btn-primary">${t('Save Message','පණිවිඩය සුරකින්න')}</button></form></div>`}
function submitContact(e){e.preventDefault();toast(t('Message saved on this device.','පණිවිඩය මෙම උපාංගයේ සුරැකිණි.'));e.target.reset()}
function notificationsPage(){const list=notifications.slice().sort((a,b)=>b.time-a.time);return `<div class="page">${heading('Notifications','දැනුම්දීම්','See new school updates and notice alerts.','අලුත් පාසල් update හා notice දැනුම්දීම් බලන්න.')}<div class="toolbar"><button class="btn btn-gold" onclick="markAllRead()">${t('Mark all as read','සියල්ල කියවා ඇත ලෙස සලකුණු කරන්න')}</button><button class="btn btn-light" onclick="clearNotifications()">${t('Clear notifications','දැනුම්දීම් හිස් කරන්න')}</button></div><div class="list">${list.length?list.map(n=>`<div class="list-row notification-item ${n.read?'':'unread'}"><div class="notification-icon">${n.type==='notice'?'📢':'🔔'}</div><div style="flex:1"><b>${esc(t(n.titleEn,n.titleSi))}</b><p>${esc(t(n.textEn,n.textSi))}</p><span class="date">${new Date(n.time).toLocaleString()}</span></div><button class="btn btn-light btn-small" onclick="openNotification(${n.id})">${t('Open','විවෘත කරන්න')}</button></div>`).join(''):empty(t('No notifications.','දැනුම්දීම් නැත.'))}</div></div>`}
function openNotification(id){const n=notifications.find(x=>x.id===id);if(!n)return;n.read=true;saveAll();if(n.refType==='notice')openNotice(n.refId);else render()}
function markAllRead(){notifications.forEach(n=>n.read=true);saveAll();render();toast(t('All notifications marked as read.','සියලු දැනුම්දීම් කියවා ඇත ලෙස සලකුණු කළා.'))}
function clearNotifications(){notifications=[];saveAll();render();toast(t('Notifications cleared.','දැනුම්දීම් හිස් කළා.'))}
function settingsPage(){return `<div class="page">${heading('Settings','සැකසුම්','Change language and appearance preferences.','භාෂාව හා පෙනුම වෙනස් කරන්න.')}<div class="panel" style="padding:20px;display:grid;gap:14px"><div class="admin-note">🌙 ${t('Dark Theme changes the full app appearance. Normal mode uses clear black text.','Dark Theme එකෙන් සම්පූර්ණ app එකේ පෙනුම මාරු වේ. Normal mode එකේ text තද කළු පැහැයෙන් පෙනේ.')}</div><button class="btn btn-gold" onclick="toggleLanguage()">🌐 ${t('Switch Language','භාෂාව මාරු කරන්න')}</button><label class="check"><input class="checkbox" type="checkbox" ${settings.dark?'checked':''} onchange="settings.dark=this.checked;saveAll();render()"> 🌙 ${t('Dark theme','Dark Theme')}</label><label class="check"><input class="checkbox" type="checkbox" ${settings.compact?'checked':''} onchange="settings.compact=this.checked;saveAll();render()"> ${t('Compact layout','සංක්ෂිප්ත layout')}</label><label class="check"><input class="checkbox" type="checkbox" ${settings.contrast?'checked':''} onchange="settings.contrast=this.checked;saveAll();render()"> ${t('High contrast','වැඩි contrast')}</label></div></div>`}

function admin(){if(!logged)return `<div class="page"><div class="login-wrap"><div class="panel"><div class="eyebrow">PMV</div><h1 style="color:var(--wine)">${t('Admin Login','පරිපාලක Login')}</h1><p class="muted">${t('Manage everything in the app from here.','App එකේ සියලු දේ මෙතැනින් manage කරන්න.')}</p><form style="display:grid;gap:12px" onsubmit="login(event)"><input class="field" id="adminUser" required placeholder="Username"><input class="field" id="adminPass" required type="password" placeholder="Password"><button class="btn btn-primary">${t('Login','Login')}</button></form></div></div></div>`;
return `<div class="page">${heading('Admin Panel','පරිපාලක පැනලය','Edit school information, notices, events, media, teachers, PDFs, logo and background.','පාසලේ සියලුම තොරතුරු, notices, events, media, teachers, PDFs, logo හා background වෙනස් කරන්න.')}<div class="admin-note">🔐 ${t('Text changes sync with Firebase; photos, videos and PDFs are uploaded to Cloudinary for everyone.','Text changes Firebase සමඟ sync වේ; photos, videos සහ PDFs Cloudinary වෙත upload වී හැමෝටම පෙනේ.')}</div><div class="admin-tabs">${[['overview','Overview','සාරාංශය'],['school','School & Home','පාසල හා මුල් පිටුව'],['parents','Parents / Contact','දෙමාපිය / Contact'],['principal','Principal','විදුහල්පති'],['teachers','Teachers','ගුරුවරු'],['notices','Notices','දැනුම්දීම්'],['events','Events','සිදුවීම්'],['achievements','Achievements','ජයග්‍රහණ'],['gallery','Photos','ඡායාරූප'],['videos','Videos','වීඩියෝ'],['applications','PDFs','PDF'],['appearance','Logo / Background','Logo / Background']].map(a=>`<button class="admin-tab ${adminTabName===a[0]?'active':''}" onclick="setAdminTab('${a[0]}')">${t(a[1],a[2])}</button>`).join('')}</div><div id="adminArea"></div></div>`}
function setAdminTab(n){adminTabName=n;render();setTimeout(()=>renderAdminArea(),0)}
async function renderAdminArea(){if(location.hash.slice(1)!=='admin'||!logged)return;const a=document.getElementById('adminArea');if(!a)return;const fn={overview:adminOverview,school:adminSchool,parents:adminParents,principal:adminPrincipal,teachers:adminTeachers,notices:adminNotices,events:adminEvents,achievements:adminAchievements,gallery:adminGallery,videos:adminVideos,applications:adminApplications,appearance:adminAppearance}[adminTabName]||adminOverview;const html=await Promise.resolve(fn());a.innerHTML=html+`<div class="admin-note" style="margin-top:12px">${pmvFirestoreReady?t('☁ Online sync: Firestore connected.','☁ Online sync: Firestore connected.'):t('☁ Online sync is connecting...','☁ Online sync connect වෙමින්...')}</div>`;hydrateMedia(a)}
function adminOverview(){return `<div class="stats"><div class="stat"><b>${db.notices.length}</b><small>${t('Notices','දැනුම්දීම්')}</small></div><div class="stat"><b>${db.events.length}</b><small>${t('Events','සිදුවීම්')}</small></div><div class="stat"><b>${db.teachers.length}</b><small>${t('Teachers profiles','ගුරු පැතිකඩ')}</small></div><div class="stat"><b>${db.gallery.length+db.videos.length}</b><small>${t('Media items','Media')}</small></div></div><div class="section-head"><h2>${t('What you can manage','ඔබට manage කළ හැකි දේ')}</h2></div><div class="grid">${[['🏫','School & Home','පාසල හා මුල් පිටුව','school'],['👨‍👩‍👧','Parents / Contact','දෙමාපිය / Contact','parents'],['👤','Principal','විදුහල්පති','principal'],['👨‍🏫','Teachers','ගුරුවරු','teachers'],['📢','Notices','දැනුම්දීම්','notices'],['📅','Events + Photo/Video','සිදුවීම් + Photo/Video','events'],['🏆','Achievements + Photo/Video','ජයග්‍රහණ + Photo/Video','achievements'],['📷','Photos','ඡායාරූප','gallery'],['🎥','Videos','වීඩියෝ','videos'],['📄','PDFs','PDF','applications'],['🎨','Logo / Background','Logo / Background','appearance']].map(x=>`<article class="card"><div class="icon">${x[0]}</div><h3>${t(x[1],x[2])}</h3><button class="btn btn-primary btn-small" onclick="setAdminTab('${x[3]}')">${t('Manage','Manage')} →</button></article>`).join('')}</div>`}
function langInputs(prefix,labelSi,labelEn,valSi='',valEn=''){return `<div class="two"><label class="form-field">${esc(labelSi)}<span>සිංහල</span><input class="field" id="${prefix}Si" value="${esc(valSi)}"></label><label class="form-field">${esc(labelEn)}<span>English</span><input class="field" id="${prefix}En" value="${esc(valEn)}"></label></div>`}
function textareas(prefix,labelSi,labelEn,valSi='',valEn=''){return `<div class="two"><label class="form-field">${esc(labelSi)}<span>සිංහල</span><textarea class="field" id="${prefix}Si" rows="5">${esc(valSi)}</textarea></label><label class="form-field">${esc(labelEn)}<span>English</span><textarea class="field" id="${prefix}En" rows="5">${esc(valEn)}</textarea></label></div>`}
function adminSchool(){return `<div class="panel" style="padding:20px"><form onsubmit="saveSchool(event)" style="display:grid;gap:14px">${langInputs('sName','පාසල් නම','School Name',school.nameSi,school.nameEn)}${langInputs('sMotto','මෝටෝ','Motto',school.mottoSi,school.mottoEn)}${langInputs('sAddress','ලිපිනය','Address',school.addressSi,school.addressEn)}<div class="two"><label class="form-field">${t('Phone','දුරකථන')}<input class="field" id="sPhone" value="${esc(school.phone)}"></label><label class="form-field">Email<input class="field" id="sEmail" value="${esc(school.email)}"></label></div><div class="two"><label class="form-field">${t('Student count','සිසුන් ගණන')}<input class="field" id="sStudents" type="number" value="${esc(school.students)}"></label><label class="form-field">${t('Teacher count','ගුරුවරු ගණන')}<input class="field" id="sTeachers" type="number" value="${esc(school.teachers)}"></label></div>${textareas('sMission','මෙහෙවර','Mission',school.missionSi,school.missionEn)}${textareas('sVision','දැක්ම','Vision',school.visionSi,school.visionEn)}${langInputs('sParentsTitle','දෙමාපිය කොටසේ මාතෘකාව','Parents Section Title',school.parentsTitleSi||'පවුල් සහභාගීත්වය',school.parentsTitleEn||'Family Partnership')}${textareas('sParentsText','දෙමාපිය කොටසේ විස්තර','Parents Section Text',school.parentsTextSi||'',school.parentsTextEn||'')}<button class="btn btn-primary">${t('Save School & Home','පාසල හා මුල් පිටුව Save කරන්න')}</button></form></div>`}
function saveSchool(e){e.preventDefault();school.nameSi=sNameSi.value;school.nameEn=sNameEn.value;school.mottoSi=sMottoSi.value;school.mottoEn=sMottoEn.value;school.addressSi=sAddressSi.value;school.addressEn=sAddressEn.value;school.phone=sPhone.value;school.email=sEmail.value;school.students=Number(sStudents.value)||0;school.teachers=Number(sTeachers.value)||0;school.missionSi=sMissionSi.value;school.missionEn=sMissionEn.value;school.visionSi=sVisionSi.value;school.visionEn=sVisionEn.value;school.parentsTitleSi=sParentsTitleSi.value;school.parentsTitleEn=sParentsTitleEn.value;school.parentsTextSi=sParentsTextSi.value;school.parentsTextEn=sParentsTextEn.value;saveAll();render();toast(t('School information updated.','පාසල් තොරතුරු update කළා.'));}
function adminParents(){const titleSi=school.parentsTitleSi||'පවුල් සහභාගීත්වය',titleEn=school.parentsTitleEn||'Family Partnership',textSi=school.parentsTextSi||'',textEn=school.parentsTextEn||'';return `<div class="panel" style="padding:20px"><form onsubmit="saveParents(event)" style="display:grid;gap:14px"><h2 style="color:var(--wine)">${t('Parents / Contact Content','දෙමාපිය / Contact තොරතුරු')}</h2>${langInputs('parTitle','මාතෘකාව','Title',titleSi,titleEn)}${textareas('parText','විස්තර','Details',textSi,textEn)}<p class="small muted">${t('Phone, email and address are edited from School & Home.','Phone, email සහ address School & Home කොටසෙන් වෙනස් කළ හැක.')}</p><button class="btn btn-primary">${t('Save Parents Content','දෙමාපිය තොරතුරු Save කරන්න')}</button></form></div>`}
function saveParents(e){e.preventDefault();school.parentsTitleSi=parTitleSi.value;school.parentsTitleEn=parTitleEn.value;school.parentsTextSi=parTextSi.value;school.parentsTextEn=parTextEn.value;saveAll();render();toast(t('Parents content updated.','දෙමාපිය තොරතුරු update කළා.'));}
function adminPrincipal(){const p=school.principal||{};return `<div class="panel" style="padding:20px"><form onsubmit="savePrincipal(event)" style="display:grid;gap:14px">${langInputs('pName','නම','Name',p.nameSi||'',p.nameEn||'')}${textareas('pBio','විස්තර','Details',p.bioSi||'',p.bioEn||'')}<label class="form-field">${t('Principal photo','විදුහල්පති photo')}<input class="field" id="pPhoto" type="file" accept="image/*" onchange="previewInput(this,'principalPreview')"></label><div id="principalPreview"></div><div class="admin-preview-row">${p.photoData?`<img src="${esc(p.photoData)}" alt="Principal">`:p.photoId?`<img src="" data-media-id="${p.photoId}" alt="Principal">`:empty(t('No principal photo yet.','විදුහල්පති photo එකක් තවම නැහැ.'))}</div><button class="btn btn-primary">${t('Save Principal','විදුහල්පති Save කරන්න')}</button></form></div>`}
async function savePrincipal(e){e.preventDefault();school.principal=school.principal||{};school.principal.nameSi=pNameSi.value;school.principal.nameEn=pNameEn.value;school.principal.bioSi=pBioSi.value;school.principal.bioEn=pBioEn.value;const f=pPhoto.files&&pPhoto.files[0];if(f){const u=await cloudinaryImageUpload(f);school.principal.photoData=u;school.principal.photoId=u}saveAll();render();toast(t('Principal updated.','විදුහල්පති තොරතුරු update කළා.'));}
function adminTeachers(){return `<div class="panel" style="padding:20px"><h2 style="color:var(--wine)">${t('Add / Edit Teacher','ගුරුවරයෙක් එකතු / Edit කරන්න')}</h2><form onsubmit="addTeacher(event)" style="display:grid;gap:13px">${langInputs('tName','නම','Name','','')}${langInputs('tSubject','උගන්වන විෂය','Teaching Subject','','')}${textareas('tBio','විස්තර','Details','','')}<label class="form-field">Photo<input class="field" id="tPhoto" type="file" accept="image/*" onchange="previewInput(this,'teacherPreview')"></label><div id="teacherPreview"></div><button class="btn btn-primary">${t('Add Teacher','ගුරුවරයෙක් එකතු කරන්න')}</button></form></div><div class="section-head"><h2>${t('Teacher profiles','ගුරු පැතිකඩ')}</h2></div><div class="staff-grid">${db.teachers.map(x=>`<article class="card staff-card">${x.photoData?`<img class="avatar" src="${esc(x.photoData)}" alt="Teacher">`:x.photoId?`<img class="avatar" src="" data-media-id="${x.photoId}" alt="Teacher">`:`<div class="avatar" style="margin:auto;display:flex;align-items:center;justify-content:center;font-size:34px">👨‍🏫</div>`}<h3>${esc(t(x.nameEn,x.nameSi))}</h3><div class="subjects">${esc(t(x.subjectEn,x.subjectSi))}</div><p>${esc(t(x.bioEn,x.bioSi))}</p><div class="item-tools" style="justify-content:center"><button class="btn btn-light btn-small" onclick="editTeacher(${x.id})">${t('Edit','Edit')}</button><button class="btn btn-primary btn-small" onclick="openTeacher(${x.id})">${t('Open','විවෘත කරන්න')}</button><button class="btn btn-danger btn-small" onclick="deleteTeacher(${x.id})">${t('Delete','Delete')}</button></div></article>`).join('')||empty(t('No teachers yet.','ගුරුවරු නැත.'))}</div>`}
async function addTeacher(e){e.preventDefault();const f=tPhoto.files&&tPhoto.files[0];db.teachers.push({id:Date.now(),nameSi:tNameSi.value,nameEn:tNameEn.value,subjectSi:tSubjectSi.value,subjectEn:tSubjectEn.value,bioSi:tBioSi.value,bioEn:tBioEn.value,photoData:f?await cloudinaryImageUpload(f):'',photoId:null});saveAll();render();toast(t('Teacher added.','ගුරුවරයා එකතු කළා.'));}
function editTeacher(id){const x=db.teachers.find(v=>v.id===id);if(!x)return;document.getElementById('adminArea').innerHTML=`<div class="panel" style="padding:20px"><form onsubmit="saveTeacherEdit(event,${id})" style="display:grid;gap:13px">${langInputs('eTName','නම','Name',x.nameSi||'',x.nameEn||'')}${langInputs('eTSubject','උගන්වන විෂය','Teaching Subject',x.subjectSi||'',x.subjectEn||'')}${textareas('eTBio','විස්තර','Details',x.bioSi||'',x.bioEn||'')}<label class="form-field">Photo<input class="field" id="eTPhoto" type="file" accept="image/*"></label><div class="admin-preview-row">${x.photoData?`<img src="${esc(x.photoData)}" alt="Teacher">`:x.photoId?`<img src="" data-media-id="${x.photoId}" alt="Teacher">`:empty(t('No photo yet.','photo එකක් නැහැ.'))}</div><button class="btn btn-primary">${t('Save Changes','වෙනස්කම් Save කරන්න')}</button><button type="button" class="btn btn-light" onclick="setAdminTab('teachers')">${t('Cancel','අවලංගු')}</button></form></div>`;hydrateMedia(document.getElementById('adminArea'));}
async function saveTeacherEdit(e,id){e.preventDefault();const x=db.teachers.find(v=>v.id===id);x.nameSi=eTNameSi.value;x.nameEn=eTNameEn.value;x.subjectSi=eTSubjectSi.value;x.subjectEn=eTSubjectEn.value;x.bioSi=eTBioSi.value;x.bioEn=eTBioEn.value;const f=eTPhoto.files&&eTPhoto.files[0];if(f){const u=await cloudinaryImageUpload(f);x.photoData=u;x.photoId=u}saveAll();render();toast(t('Teacher updated.','ගුරුවරයා update කළා.'));}
function deleteTeacher(id){if(!confirm(t('Delete this teacher?','මේ ගුරුවරයා delete කරන්නද?')))return;db.teachers=db.teachers.filter(x=>x.id!==id);saveAll();render();toast(t('Teacher deleted.','ගුරුවරයා delete කළා.'));}

function adminNotices(){return `<div class="panel" style="padding:20px"><form onsubmit="addNotice(event)" style="display:grid;gap:13px"><h2 style="color:var(--wine)">${t('Add Notice','අලුත් දැනුම්දීමක්')}</h2>${langInputs('nTitle','මාතෘකාව','Headline','','')}${langInputs('nCat','වර්ගය','Category','පාසල් පුවත්','School News')}${textareas('nBody','විස්තර','Description','','')}<label class="check"><input class="checkbox" id="nNotify" type="checkbox" checked> 🔔 ${t('Create notification for this new notice','මේ notice එකට notification එකක් දෙන්න')}</label><button class="btn btn-primary">${t('Publish Notice','දැනුම්දීම Publish කරන්න')}</button></form></div><div class="section-head"><h2>${t('Manage Notices','දැනුම්දීම් Manage කරන්න')}</h2></div><div class="list">${db.notices.map(n=>`<div class="list-row"><div><span class="tag">${esc(t(n.catEn,n.catSi))}</span><h3>${esc(t(n.titleEn,n.titleSi))}</h3><p>${esc(t(n.bodyEn,n.bodySi))}</p><span class="date">${esc(n.date)}</span></div><div class="item-tools"><button class="btn btn-light btn-small" onclick="editNotice(${n.id})">${t('Edit','Edit')}</button><button class="btn btn-danger btn-small" onclick="deleteNotice(${n.id})">${t('Delete','Delete')}</button></div></div>`).join('')}</div>`}
function addNotice(e){e.preventDefault();const n={id:Date.now(),titleSi:nTitleSi.value,titleEn:nTitleEn.value,catSi:nCatSi.value||'පාසල් පුවත්',catEn:nCatEn.value||'School News',bodySi:nBodySi.value,bodyEn:nBodyEn.value,date:new Date().toISOString().slice(0,10),createdAt:Date.now(),notify:nNotify.checked};db.notices.unshift(n);if(n.notify){const no={id:Date.now()+1,type:'notice',refType:'notice',refId:n.id,titleSi:n.titleSi,titleEn:n.titleEn,textSi:'නව දැනුම්දීමක් එකතු කර ඇත.',textEn:'A new school notice has been added.',time:Date.now(),read:false};notifications.unshift(no);saveAll();browserNotify(t(n.titleEn,n.titleSi));}else saveAll();render();toast(t('Notice published and notification created.','Notice එක Publish කර notification එකත් සෑදුවා.'));}
function editNotice(id){const n=db.notices.find(x=>x.id===id);document.getElementById('adminArea').innerHTML=`<div class="panel" style="padding:20px"><form onsubmit="saveNoticeEdit(event,${id})" style="display:grid;gap:13px">${langInputs('enTitle','මාතෘකාව','Headline',n.titleSi,n.titleEn)}${langInputs('enCat','වර්ගය','Category',n.catSi,n.catEn)}${textareas('enBody','විස්තර','Description',n.bodySi,n.bodyEn)}<input class="field" id="enDate" type="date" value="${esc(n.date)}"><button class="btn btn-primary">${t('Save Changes','වෙනස්කම් Save කරන්න')}</button><button type="button" class="btn btn-light" onclick="setAdminTab('notices')">${t('Cancel','අවලංගු')}</button></form></div>`;}
function saveNoticeEdit(e,id){e.preventDefault();const n=db.notices.find(x=>x.id===id);n.titleSi=enTitleSi.value;n.titleEn=enTitleEn.value;n.catSi=enCatSi.value;n.catEn=enCatEn.value;n.bodySi=enBodySi.value;n.bodyEn=enBodyEn.value;n.date=enDate.value;saveAll();render();toast(t('Notice updated.','Notice එක update කළා.'));}
function deleteNotice(id){if(!confirm(t('Delete this notice?','මේ notice එක delete කරන්නද?')))return;db.notices=db.notices.filter(x=>x.id!==id);notifications=notifications.filter(n=>n.refId!==id);saveAll();render();toast(t('Notice deleted.','Notice එක delete කළා.'));}

async function savePdfEdit(e,id){e.preventDefault();const x=db.applications.find(v=>v.id===id);x.titleSi=epdfTitleSi.value;x.titleEn=epdfTitleEn.value;x.descSi=epdfDescSi.value;x.descEn=epdfDescEn.value;const f=epdfFile.files&&epdfFile.files[0];if(f){if(x.pdfId){try{await mediaDelete(x.pdfId)}catch{}}x.pdfId=await mediaPut('pdf',f);x.pdfData='';x.fileName=f.name}saveAll();render();toast(t('PDF updated.','PDF එක update කළා.'));}
async function addPdf(e){e.preventDefault();const f=pdfFile.files&&pdfFile.files[0];if(!f||(!f.type.includes('pdf')&&!f.name.toLowerCase().endsWith('.pdf'))){toast(t('Please choose a PDF file.','කරුණාකර PDF file එකක් තෝරන්න.'));return}const pdfId=await mediaPut('pdf',f);const pdfData='';db.applications.unshift({id:Date.now(),titleSi:pdfTitleSi.value,titleEn:pdfTitleEn.value,descSi:pdfDescSi.value,descEn:pdfDescEn.value,pdfId,pdfData,fileName:f.name});const ok=saveAll();if(ok){render();toast(t('PDF added. Open / Download / Print are ready.','PDF එක එකතු කළා. Open / Download / Print දැන් වැඩ.'))}else{toast(t('Storage is full. Remove old items and try again.','Storage පිරී ඇත. පරණ items කිහිපයක් මකා ආයෙ උත්සාහ කරන්න.'))}}
function deletePdf(id){if(!confirm(t('Delete this PDF?','මේ PDF එක delete කරන්නද?')))return;db.applications=db.applications.filter(x=>x.id!==id);saveAll();render();toast(t('PDF deleted.','PDF එක delete කළා.'));}

function readFileDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('FileReader error'));r.readAsDataURL(file)})}
async function fileToDataUrl(file,maxSize,quality=0.84){return cloudinaryImageUpload(file)}

async function saveBg(input){const f=input.files&&input.files[0];if(!f)return;try{settings.bgData=await cloudinaryImageUpload(f);settings.bgId=null;saveAll();await applyMediaSettings();if(location.hash.slice(1)==='admin')await renderAdminArea();toast(t('Background updated successfully.','Background එක සාර්ථකව update කළා.'));}catch(err){console.error(err);toast(t('Could not save the background.','Background එක save කරන්න බැරි වුණා.'));}}

async function openEvent(id){const e=db.events.find(x=>x.id===id);if(!e)return;const ph=e.photoData||'';const po=e.photoId?await mediaGet(e.photoId):null;const vi=e.videoId?await mediaGet(e.videoId):null;const phUrl=ph||(po?.url||((po?.blob)?URL.createObjectURL(po.blob):''));document.getElementById('modalBody').innerHTML=`<span class="tag">${esc(e.date)}</span><h2>${esc(t(e.titleEn,e.titleSi))}</h2><p><b>${esc(e.time)}</b> · ${esc(t(e.placeEn,e.placeSi))}</p><p class="readable-text" style="line-height:1.9;white-space:pre-line">${esc(t(e.descEn,e.descSi))}</p><div class="modal-media">${phUrl?`<img src="${esc(phUrl)}" alt="Event photo">`:''}${vi?`<video controls src="${esc(vi.url||((vi.blob)?URL.createObjectURL(vi.blob):''))}"></video>`:''}</div>`;showModal()}
async function openAchievement(id){const a=db.achievements.find(x=>x.id===id);if(!a)return;const ph=a.photoData||'';const po=a.photoId?await mediaGet(a.photoId):null;const vi=a.videoId?await mediaGet(a.videoId):null;const phUrl=ph||(po?.url||((po?.blob)?URL.createObjectURL(po.blob):''));document.getElementById('modalBody').innerHTML=`<span class="tag">🏆</span><h2>${esc(t(a.titleEn,a.titleSi))}</h2><p class="readable-text" style="line-height:1.9;white-space:pre-line">${esc(t(a.descEn,a.descSi))}</p><div class="modal-media">${phUrl?`<img src="${esc(phUrl)}" alt="Achievement photo">`:''}${vi?`<video controls src="${URL.createObjectURL(vi.blob)}"></video>`:''}</div>`;showModal()}
async function openTeacher(id){const x=db.teachers.find(v=>v.id===id);if(!x)return;const ph=x.photoData||'';const po=x.photoId?await mediaGet(x.photoId):null;const phUrl=ph||(po?.url||((po?.blob)?URL.createObjectURL(po.blob):''));document.getElementById('modalBody').innerHTML=`<div style="text-align:center">${phUrl?`<img class="avatar" style="width:160px;height:160px" src="${esc(phUrl)}" alt="Teacher">`:'<div class="avatar" style="margin:auto;display:flex;align-items:center;justify-content:center;font-size:50px">👨‍🏫</div>'}<h2>${esc(t(x.nameEn,x.nameSi))}</h2><div class="subjects">${esc(t(x.subjectEn,x.subjectSi))}</div><p class="readable-text" style="white-space:pre-line;line-height:1.9">${esc(t(x.bioEn,x.bioSi))}</p></div>`;showModal()}
async function openMediaItem(kind,id){const item=kind==='photo'?db.gallery.find(x=>x.id===id):db.videos.find(x=>x.id===id);if(!item)return;let u=item.dataUrl||item.photoData||'';if(!u&&item.mediaId){const o=await mediaGet(item.mediaId);if(o)u=o.url||((o.blob)?URL.createObjectURL(o.blob):'')}if(!u){toast(t('Media file missing.','Media file එක හමු නොවීය.'));return}document.getElementById('modalBody').innerHTML=`<h2>${esc(t(item.titleEn,item.titleSi))}</h2><p class="readable-text" style="white-space:pre-line;line-height:1.9">${esc(t(item.descEn,item.descSi))}</p><div class="modal-media">${kind==='photo'?`<img src="${esc(u)}" alt="${esc(t(item.titleEn,item.titleSi))}">`:`<video controls autoplay src="${esc(u)}"></video>`}</div>`;showModal()}
async function resolvePdf(a){if(!a)return null;if(a.pdfData)return {url:a.pdfData,revoke:false};if(a.pdfId){const o=await mediaGet(a.pdfId);if(o)return {url:o.url||((o.blob)?URL.createObjectURL(o.blob):''),revoke:!o.url}}return null}
async function openPdf(id){const a=db.applications.find(x=>x.id===id);if(!a)return;const r=await resolvePdf(a);if(!r){toast(t('PDF file missing.','PDF file එක හමු නොවීය.'));return}document.getElementById('modalBody').innerHTML=`<h2>${esc(t(a.titleEn,a.titleSi))}</h2><p class="readable-text" style="white-space:pre-line;line-height:1.8">${esc(t(a.descEn,a.descSi))}</p><div class="item-tools" style="margin:10px 0"><a class="btn btn-gold btn-small" href="${esc(r.url)}" download="${esc(a.fileName||'PMV.pdf')}">${t('Download PDF','PDF Download')}</a><button class="btn btn-primary btn-small" onclick="printPdf(${id})">${t('Print PDF','PDF Print')}</button><a class="btn btn-light btn-small" href="${esc(r.url)}" target="_blank">${t('Open in new tab','නව tab එකකින් විවෘත කරන්න')}</a></div><iframe class="modal-pdf" src="${esc(r.url)}" title="PDF preview"></iframe>`;showModal()}
async function downloadPdf(appId){const a=db.applications.find(x=>x.id===appId);const r=await resolvePdf(a);if(!r){toast(t('PDF file missing.','PDF file එක හමු නොවීය.'));return}const link=document.createElement('a');link.href=r.url;link.download=a.fileName||'PMV-form.pdf';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>r.revoke&&URL.revokeObjectURL(r.url),2500)}
async function printPdf(appId){const a=db.applications.find(x=>x.id===appId);const r=await resolvePdf(a);if(!r){toast(t('PDF file missing.','PDF file එක හමු නොවීය.'));return}printUrl(r.url)}
function printUrl(url){const old=document.getElementById('pmvPrintFrame');if(old)old.remove();const fr=document.createElement('iframe');fr.id='pmvPrintFrame';fr.style.position='fixed';fr.style.left='-9999px';fr.style.top='0';fr.style.width='1px';fr.style.height='1px';fr.style.border='0';fr.onload=()=>setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch{const w=window.open(url,'_blank');if(w){setTimeout(()=>{try{w.focus();w.print()}catch{}},700)}}},600);fr.src=url;document.body.appendChild(fr);setTimeout(()=>{try{fr.remove()}catch{}},60000)}
async function downloadMedia(id,name){const o=await mediaGet(id);if(!o){toast(t('File missing.','File එක හමු නොවීය.'));return}const a=document.createElement('a');a.href=URL.createObjectURL(o.blob);a.download=name||o.name||'download';document.body.appendChild(a);a.click();a.remove()}

function previewInput(input,id){const f=input.files[0];if(!f)return;const u=URL.createObjectURL(f);document.getElementById(id).innerHTML=`<img class="preview-img" src="${u}" alt="Preview">`}
async function hydrateMedia(root=document){if(!root)return;for(const el of root.querySelectorAll('[data-media-id]')){const raw=el.dataset.mediaId;if(!raw)continue;try{const o=await mediaGet(raw);if(!o)continue;const u=o.url||((o.blob)?URL.createObjectURL(o.blob):'');if(!u)continue;if(el.tagName==='IMG'){el.src=u;el.style.display='block'}else if(el.tagName==='VIDEO'){el.src=u;el.load()}}catch(err){console.warn('PMV media load failed',raw,err)}}for(const card of root.querySelectorAll('[data-media-card]')){const kind=card.dataset.mediaCard,id=Number(card.dataset.id),item=kind==='photo'?db.gallery.find(v=>v.id===id):db.videos.find(v=>v.id===id);if(!item)continue;try{let u=item.dataUrl||item.photoData||'';if(!u&&item.mediaId){const o=await mediaGet(item.mediaId);if(o)u=o.url||((o.blob)?URL.createObjectURL(o.blob):'')}if(!u){card.innerHTML=`<div class="empty">${t('Media file not found.','Media file එක හමු නොවීය.')}</div>`;continue}card.innerHTML=kind==='photo'?`<img class="media-cover" src="${esc(u)}" alt="${esc(t(item.titleEn,item.titleSi))}" loading="lazy">`:`<video controls preload="metadata" class="media-cover" src="${esc(u)}"></video>`}catch(err){console.warn('PMV media card failed',err);card.innerHTML=`<div class="empty">${t('Could not load media.','Media load කරන්න බැරි වුණා.')}</div>`}}}

/* IndexedDB: keeps large photos/videos/PDFs working better than localStorage. */
const DB_NAME='PMVMediaDB2',STORE='files';let idbPromise=null;
function idb(){if(idbPromise)return idbPromise;idbPromise=new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbPromise}
async function mediaPut(kind,file){
  const k=kind==='pdf'?'pdf':(kind==='video'?'video':'image');
  return cloudinaryUpload(k,file);
}
async function mediaGet(id){
  if(id===null||id===undefined||id==='')return null;
  if(typeof id==='string'&&/^https?:\/\//i.test(id)){
    try{const r=await fetch(id);if(!r.ok)throw new Error('Media fetch failed');return {id,name:id.split('/').pop()||'media',type:r.headers.get('content-type')||'',blob:await r.blob(),url:id};}
    catch(err){console.warn('Cloud media fetch failed',err);return {id,name:id.split('/').pop()||'media',type:'',blob:null,url:id};}
  }
  const dbx=await idb();return new Promise((res,rej)=>{const key=Number.isFinite(Number(id))?Number(id):id;let q;try{q=dbx.transaction(STORE,'readonly').objectStore(STORE).get(key)}catch(err){rej(err);return}q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})
}
async function mediaDelete(id){
  if(id===null||id===undefined||id==='')return;
  if(typeof id==='string'&&/^https?:\/\//i.test(id))return;
  try{const dbx=await idb();await new Promise((res,rej)=>{const tx=dbx.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(Number(id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch{}
}
